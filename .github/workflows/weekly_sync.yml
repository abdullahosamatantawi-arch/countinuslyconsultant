name: Weekly Mosques Sync

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers from the GitHub UI

jobs:
  sync-mosques:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back to the repo
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run sync script
        run: |
          python "الزيارات الميدانية/sync_plots.py"

      - name: Check for changes and commit/push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "الزيارات الميدانية/index.html" "الزيارات الميدانية/output.js"
          
          # Check if there are staged changes to commit
          if git diff --staged --quiet; then
            echo "No changes in data. Skipping commit."
          else
            git commit -m "Auto-sync mosques data [skip ci]"
            git push origin main
          fi

      # Optional: Direct deployment to Vercel (fallback if Vercel GitHub integration is not configured)
      - name: Install Vercel CLI
        if: "${{ env.VERCEL_TOKEN != '' }}"
        run: npm install -g vercel

      - name: Pull Vercel Project Info
        if: "${{ env.VERCEL_TOKEN != '' }}"
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
        working-directory: "الزيارات الميدانية"

      - name: Deploy Project Artifacts to Vercel
        if: "${{ env.VERCEL_TOKEN != '' }}"
        run: vercel deploy --prod --yes --token=${{ env.VERCEL_TOKEN }}
        working-directory: "الزيارات الميدانية"
