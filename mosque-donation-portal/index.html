<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#1a6b52" />
    <link rel="apple-touch-icon" href="/brand-logo-official.png" />
    <meta name="description" content="إدارة بناء ورعاية المساجد — دائرة الشؤون الإسلامية الشارقة" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.indexOf('جاري') !== -1) {
          root.innerHTML = '<div style="padding: 20px; color: #1a6b52; text-align: center; font-family: sans-serif;">' +
            '<h3>حدث خطأ أثناء تحميل المنصة</h3>' +
            '<p style="font-size: 14px; color: red;">' + msg + '</p>' +
            '<button onclick="location.reload()" style="margin-top: 10px; padding: 8px 16px; background: #1a6b52; color: white; border: none; border-radius: 4px;">إعادة التحميل</button>' +
            '</div>';
        }
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #1a6b52; font-weight: bold;">
        جاري تحميل المنصة...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
